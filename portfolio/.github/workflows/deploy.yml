# Déploiement GitHub Pages à chaque push sur main.
# (Si tu déploies sur Vercel, tu peux supprimer ce fichier : Vercel détecte Next.js tout seul.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write   # OIDC : Pages vérifie l'identité du workflow, pas de token à stocker

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # Dépôt "<user>.github.io" → laisser vide. Dépôt "portfolio" → "/portfolio".
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
      - run: touch out/.nojekyll   # sinon Jekyll ignore le dossier _next/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
